<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Unscrambler - Unscramble Letters Into Words</title>
    <meta
      name="description"
      content="Unscramble letters into words with our free Word Unscrambler. Find words from letters, use wildcards, filter by length, sort results, and copy your answers."
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cluevra.com/word-unscrambler" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Word Unscrambler - Unscramble Letters Into Words" />
    <meta
      property="og:description"
      content="Unscramble letters into words with our free Word Unscrambler. Find words from letters, use wildcards, filter by length, sort results, and copy your answers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cluevra.com/word-unscrambler" />
    <meta property="og:site_name" content="Word Unscrambler" />

    <!-- Twitter / X Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Word Unscrambler - Unscramble Letters Into Words" />
    <meta
      name="twitter:description"
      content="Unscramble letters into words with our free Word Unscrambler. Find words from letters, use wildcards, filter by length, sort results, and copy your answers."
    />

    <!-- JSON-LD Structured Data: WebApplication -->
    <script id="schema-webapplication" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Word Unscrambler",
      "url": "https://cluevra.com/word-unscrambler",
      "description": "Unscramble letters into words with our free Word Unscrambler. Find words from letters, use wildcards, filter by length, sort results, and copy your answers.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: FAQPage (Matches visible page content) -->
    <script id="schema-faqpage" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a word unscrambler?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A word unscrambler is a free online tool that rearranges scrambled letters into all possible valid dictionary words. It serves as an anagram solver and word finder for games like Scrabble, Words with Friends, Wordfeud, and crossword puzzles."
          }
        },
        {
          "@type": "Question",
          "name": "How do I unscramble letters?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Enter your letters into the input box and click Unscramble. You can enter letters in any order, use spaces or punctuation (which are automatically cleaned), and press Enter to instantly see all valid matching words grouped by length."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use duplicate letters?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The unscrambler strictly respects letter frequencies. If you enter two 'A's, only words requiring up to two 'A's will be generated. Words requiring more copies of a letter than you provided will not be shown."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use blank or wildcard tiles?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can use question marks (?) or asterisks (*) to represent blank tiles. Each wildcard can represent any letter from A to Z, allowing you to solve board game racks with unknown or blank spaces (up to 3 wildcards supported)."
          }
        },
        {
          "@type": "Question",
          "name": "Can I filter words by length?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Use the word length sliders to define minimum and maximum word lengths between 2 and 15 letters. You can also sort the results by longest first, shortest first, or alphabetically."
          }
        },
        {
          "@type": "Question",
          "name": "Does the tool work on mobile?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Word Unscrambler is fully responsive and optimized for mobile devices, tablets, and desktop browsers with touch-friendly controls and instant copy features."
          }
        },
        {
          "@type": "Question",
          "name": "Is the Word Unscrambler free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, the Word Unscrambler is 100% free to use with no account registration, subscriptions, or hidden limits required."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
